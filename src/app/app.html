@if (showShell()) {
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0
                 013.598 6 11.955 11.955 0 003 10c0 5.592 3.824 10.29
                 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57
                 -.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286z" />
          </svg>
        </div>
        <span>SafeCity</span>
      </div>

      <nav class="sidebar-nav">
        <a routerLink="/register" routerLinkActive="active" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0
                 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
          Register User
        </a>
        <a routerLink="/update" routerLinkActive="active" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2
                 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828
                 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          Update User
        </a>
        <a routerLink="/getall" routerLinkActive="active" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10
                 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3
                 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356
                 -1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0
                 11-6 0 3 3 0 016 0z"/>
          </svg>
          All Users
        </a>
        <a routerLink="/delete" routerLinkActive="active" class="sidebar-link danger">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2
                 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1
                 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          Delete User
        </a>
      </nav>

      <div class="sidebar-footer">
        <a routerLink="/" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001
                 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6
                 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011
                 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Home
        </a>
      </div>
    </aside>

    <!-- Main content area -->
    <main class="shell-main">
      <router-outlet />
    </main>
  </div>

} @else {
  <!-- ── PUBLIC PAGES (Home, Login, Register landing) — no sidebar ── -->
  <router-outlet />
}
