<div class="login-page">

  <!-- Left Panel -->
  <div class="login-left">
    <div class="brand">
      <div class="brand-logo">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0
               013.598 6 11.955 11.955 0 003 10c0 5.592 3.824 10.29
               9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57
               -.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286z"/>
        </svg>
      </div>
      <span class="brand-name">SafeCity</span>
    </div>
    <h1 class="left-title">Urban Safety &<br/>Emergency Response</h1>
    <p class="left-sub">A centralised platform for citizens, responders,
      and administrators to manage city safety operations.</p>
    <div class="left-stats">
      <div class="stat"><div class="stat-n">6</div><div class="stat-l">User Roles</div></div>
      <div class="stat"><div class="stat-n">8</div><div class="stat-l">Modules</div></div>
      <div class="stat"><div class="stat-n">99.9%</div><div class="stat-l">Uptime</div></div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="login-right">
    <div class="login-card">

      <div class="card-header">
        <h2 class="card-title">Welcome back</h2>
        <p class="card-sub">Sign in to your SafeCity account</p>
      </div>

      <!-- Error -->
      <div class="alert alert-error" *ngIf="error">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Email Address <span class="required">*</span></label>
        <input
          type="email"
          class="form-input"
          placeholder="user@safecity.gov.in"
          [(ngModel)]="email"
          name="email"
          (keyup.enter)="onSubmit()"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password <span class="required">*</span></label>
        <div class="input-wrap">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-input"
            placeholder="Enter your password"
            [(ngModel)]="password"
            name="password"
            (keyup.enter)="onSubmit()"
          />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <svg *ngIf="!showPassword" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943
                   9.542 7-1.274 4.057-5.064 7-9.542 7-4.477
                   0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg *ngIf="showPassword" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478
                   0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858
                   .908a3 3 0 114.243 4.243M9.878 9.878l4.242
                   4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29
                   3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478
                   0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132
                   5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="forgot-row">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button
        type="button"
        class="btn-login"
        (click)="onSubmit()"
        [disabled]="loading"
      >
        <span *ngIf="!loading">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3
                 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          Sign In
        </span>
        <span *ngIf="loading" class="spinner-row">
          <span class="spinner"></span>
          Signing in…
        </span>
      </button>

      <!-- Register link -->
      <div class="register-link">
        Don't have an account?
        <a routerLink="/register">Register here</a>
      </div>

    </div>
  </div>

</div>
