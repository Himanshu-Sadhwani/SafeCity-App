<div class="page-wrapper">

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Register New User</h1>
      <p class="page-subtitle">Add a new user to the SafeCity platform</p>
    </div>
    <a routerLink="/" class="btn-back">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Back to Home
    </a>
  </div>

  <!-- Success Alert -->
  <div class="alert alert-success" *ngIf="success">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    {{ success }}
  </div>

  <!-- Error Alert -->
  <div class="alert alert-error" *ngIf="error">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <div>
      <div *ngFor="let e of error.split(' | ')">• {{ e }}</div>
    </div>
  </div>

  <!-- Form Card -->
  <div class="form-card">

    <!-- Section Header -->
    <div class="section-header">
      <div class="section-icon">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <span>Personal Information</span>
    </div>

    <!-- Full Name -->
    <div class="form-group">
      <label class="form-label">Full Name <span class="required">*</span></label>
      <input
        type="text"
        class="form-input"
        placeholder="e.g. Charishma Thota"
        [(ngModel)]="user.name"
        name="name"
      />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label">Email Address <span class="required">*</span></label>
      <input
        type="email"
        class="form-input"
        placeholder="user@gmail.com"
        [(ngModel)]="user.email"
        name="email"
      />
    </div>

    <!-- Phone -->
    <div class="form-group">
      <label class="form-label">Phone Number <span class="required">*</span></label>
      <input
        type="tel"
        class="form-input"
        placeholder="9876543210"
        [(ngModel)]="user.phone"
        name="phone"
      />
    </div>

    <!-- Password -->
    <div class="form-group">
      <label class="form-label">Password <span class="required">*</span></label>
      <div class="input-with-icon">
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-input"
          placeholder="Enter a strong password"
          [(ngModel)]="user.password"
          name="password"
        />
        <button type="button" class="eye-btn" (click)="togglePassword()">
          <svg *ngIf="!showPassword" fill="none" stroke="currentColor"
            stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943
                 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477
                 0-8.268-2.943-9.542-7z"/>
          </svg>
          <svg *ngIf="showPassword" fill="none" stroke="currentColor"
            stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478
                 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858
                 .908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88
                 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59
                 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943
                 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Role -->
    <div class="form-group">
      <label class="form-label">Role <span class="required">*</span></label>
      <select class="form-select" [(ngModel)]="user.roleID" name="roleID">
        <option [value]="0" disabled>Select a role…</option>
        <option [value]="1">Citizen</option>
        <option [value]="2">Police Officer</option>
        <option [value]="3">Fire Fighter</option>
        <option [value]="4">Emergency Dispatcher</option>
        <option [value]="5">Compliance Officer</option>
        <option [value]="6">City Administrator</option>
      </select>
    </div>

    <div class="divider"></div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="btn-reset" (click)="onReset()">
        Reset Form
      </button>
      <button type="button" class="btn-submit" (click)="onSubmit()" [disabled]="loading">
        <span *ngIf="!loading">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0
                 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
          Register User
        </span>
        <span *ngIf="loading" class="spinner-row">
          <span class="spinner"></span>
          Registering…
        </span>
      </button>
    </div>

    <!-- Login link -->
    <div class="login-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>

  </div>
</div>
