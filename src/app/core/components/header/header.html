<!-- src/app/core/components/header/header.html -->
<mat-toolbar class="app-header mat-elevation-z3">

  <!-- Brand -->
  <div class="header-brand">
    <div class="header-logo">
      <mat-icon>shield</mat-icon>
    </div>
    <span class="header-name">SafeCity</span>
  </div>

  <span class="spacer"></span>

  <!-- Right actions -->
  <div class="header-right">

    <!-- Notifications -->
    <button mat-icon-button class="header-icon-btn" title="Notifications">
      <mat-icon>notifications</mat-icon>
    </button>

    <!-- Profile Avatar + Dropdown -->
    <div class="profile-wrap">
      <button class="h-avatar" (click)="toggleProfile()" title="My Account">
        {{ initials }}
      </button>

      <!-- Dropdown -->
      <div class="profile-drop" *ngIf="profileOpen">

        <!-- User info top -->
        <div class="pd-header">
          <div class="pd-avatar">{{ initials }}</div>
          <div>
            <div class="pd-name">{{ userName }}</div>
            <div class="pd-role">{{ userRole }}</div>
          </div>
        </div>

        <!-- Menu items -->
        <!-- In the dropdown: -->
        <a class="pd-item" [routerLink]="profilePath" (click)="closeProfile()">
          <mat-icon>person</mat-icon>My Profile
        </a>
        <a class="pd-item" routerLink="/profile/edit" (click)="closeProfile()">
          <mat-icon>edit</mat-icon>
          Edit Account
        </a>
        <a class="pd-item" routerLink="/profile/password" (click)="closeProfile()">
          <mat-icon>lock</mat-icon>
          Change Password
        </a>
        <a class="pd-item" routerLink="/profile/notifications" (click)="closeProfile()">
          <mat-icon>notifications</mat-icon>
          Notifications
        </a>

        <mat-divider></mat-divider>

        <div class="pd-item pd-danger" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Logout
        </div>

      </div>
    </div>

  </div>
</mat-toolbar>
